<style>
:root{--bt:#F7E7A1;--pl:#FFF9DC;--cr:#FFFCF2;--pu:#38234F;--pm:#291936;--br:#68452F;--mb:#8A705A;--bd:#E9DFC3;--ok:#38734A;--wa:#A96325;--er:#A63E46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

em{font-style:normal;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px}.demo{background:var(--bt);color:var(--pm)}.rec{background:#e8f1ea;color:var(--ok)}
.hb{display:flex;align-items:center;gap:10px}.hb .l{width:96px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .r{width:70px;flex:none;text-align:right;font-size:13px;color:var(--pu);font-weight:600}
.tr{flex:1;min-width:0;height:10px;background:#fff;border-radius:6px;overflow:hidden}.tr i{display:block;height:100%;border-radius:6px}
.cols{display:flex;align-items:flex-end;gap:8px;height:160px}

.c-d{width:100px;flex:none;font-size:13px}.c-t{flex:1 1 180px;min-width:0;display:flex;flex-direction:column}.c-t small{margin-top:-2px}.c-c{width:110px;flex:none}.c-a{width:90px;flex:none;text-align:right;font-weight:700;color:var(--pu)}.c-x{display:flex;gap:6px;flex:none}

.ban{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--bt);color:var(--pm);padding:8px 14px;border-radius:10px;font-size:13px}

</style></head><body>
<aside><div class="brand"><span>₹ PaisaWise</span><button id="mb" class="btn s sm" data-act="menu" aria-expanded="false" aria-label="Open menu">Menu</button></div>
<nav id="nav"></nav><div style="margin-top:auto;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span id="api-st" class="chip">…</span><small>Records are stored in this browser.</small></div></aside>
<main id="main"></main><div id="modal"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
const fmt=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN'),kf=n=>n>=1e5?(n/1e5).toFixed(1)+'L':n>=1e3?(n/1e3).toFixed(1)+'k':Math.round(n);
const dt=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const toLocal=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
const NOW=new Date(),CM=NOW.getMonth(),CY=NOW.getFullYear(),MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const sum=a=>a.reduce((s,t)=>s+t.amount,0),median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const inM=(t,m,y)=>{const d=new Date(t.timestamp);return d.getMonth()===m&&d.getFullYear()===y};
const byCat=a=>{const o={};a.forEach(t=>o[t.category]=(o[t.category]||0)+t.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const DEF=['Food','Transport','Shopping','Bills','Healthcare','Education','Entertainment','Other'];
let S={tx:[],budgets:[],cats:[...DEF],rev:{},page:'overview',period:'all',outCat:'All categories',f:{q:'',cat:'',from:'',to:'',sort:'date-desc'}},mode='IndexedDB (this browser only)';
/* ---------- storage: IndexedDB key-value, falls back to memory ---------- */
let db=null;const open=()=>new Promise(r=>{try{const q=indexedDB.open('paisawise',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const kvGet=k=>new Promise(r=>{if(!db)return r();const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()});
const kvSet=(k,v)=>new Promise(r=>{if(!db)return r();const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r});
const save=()=>Promise.all([...['tx','budgets','cats','rev'].map(k=>kvSet(k,S[k])),kvSet('cfg',{base:API.base,token:API.token})]);
/* ---------- categorisation: keyword baseline, NOT a trained ML model ---------- */
const KW={Food:'swiggy zomato dinner lunch breakfast cafe restaurant biryani pizza coffee grocery groceries bigbasket blinkit zepto chai snack dosa',Transport:'uber ola rapido metro bus petrol fuel auto cab train irctc fastag parking',Shopping:'amazon flipkart myntra shopping clothes shoes mall ajio nykaa',Bills:'electricity bill recharge jio airtel rent wifi broadband water gas insurance emi tneb',Healthcare:'pharmacy medical apollo hospital doctor clinic medicine lab',Education:'course udemy books tuition school college fees exam coaching',Entertainment:'movie bookmyshow netflix spotify prime hotstar game concert'};
/* Swap Classifier.predict for a trained TF-IDF + LinearSVM/LogReg endpoint; the UI only calls predict(text) */
const Classifier={label:'Keyword baseline (demonstration, not a trained model)',predict(text){const w=text.toLowerCase();let best='',sc=0;for(const c of S.cats){const ws=(KW[c]||'').split(' ').filter(Boolean).concat(c.toLowerCase());const n=ws.filter(k=>w.includes(k)).length;if(n>sc){sc=n;best=c}}return sc?{cat:best,matched:true}:{cat:'Other',matched:false}}};
/* ---------- link to the PaisaWise server (ML categoriser + analytics). Every call degrades gracefully when offline ---------- */
const API={base:'',token:'',ok:false,authFail:false,info:null},A={data:null,sig:''};
const apiFetch=async(path,body,ms=15000)=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);try{const h={'Content-Type':'application/json'};if(API.token)h['X-API-Key']=API.token;const r=await fetch(API.base+path,{method:body===undefined?'GET':'POST',headers:h,body:body===undefined?undefined:JSON.stringify(body),signal:c.signal});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status});return j}finally{clearTimeout(tm)}};
const paintStatus=()=>{const s=$('#api-st');if(!s)return;const k=API.ok?['● Model online','var(--ok)']:API.authFail?['● API key needed','var(--wa)']:['○ Offline mode','var(--mb)'];s.textContent=k[0];s.style.color=k[1];s.title=API.ok?'Categorisation and analysis run on the PaisaWise server':API.authFail?'Open Settings and enter the server API key':'Using the in-browser keyword fallback; model analysis is unavailable'};
async function ping(){const was=API.ok;try{const j=await apiFetch('/api/health',undefined,5000);API.info=j;if(j.auth_required){try{await apiFetch('/api/classify',{items:[{description:'ping',amount:1}]},5000);API.ok=true;API.authFail=false}catch(e){API.ok=false;API.authFail=e.status===401}}else{API.ok=true;API.authFail=false}}catch(e){API.ok=false;API.authFail=false}
paintStatus();if(API.ok&&!was)refreshAnalysis();if(!API.ok&&was){A.data=null;A.sig=''}}
const fitCat=r=>S.cats.includes(r.category)||r.source==='user'?r.category:(S.cats.includes('Other')?'Other':r.category);
const smart={async predict(text,amount){if(API.ok){try{const r=(await apiFetch('/api/classify',{items:[{description:text,amount:amount||0}]},6000)).results[0];return{cat:fitCat(r),matched:true,conf:r.confidence,review:r.needs_review,user:r.source==='user',src:'model'}}catch(e){API.ok=false;API.authFail=e.status===401;paintStatus();setTimeout(ping,5000)}}return{...Classifier.predict(text),src:'keyword'}}};
async function classifyMany(list){const out=[];for(let i=0;i<list.length;i+=500){const ch=list.slice(i,i+500);let res=null;if(API.ok){try{res=(await apiFetch('/api/classify',{items:ch.map(p=>({description:p.description,amount:p.amount}))},30000)).results}catch(e){}}ch.forEach((p,j)=>out.push(res&&res[j]?fitCat(res[j]):Classifier.predict(p.description).cat))}return out}
const teach=(description,amount,category)=>{if(API.ok)apiFetch('/api/feedback',{description,amount,category}).then(()=>setTimeout(ping,600)).catch(()=>{})};
const analysisPayload=()=>{const b={};S.budgets.filter(x=>x.month===CM&&x.year===CY).forEach(x=>b[x.category==='Total'?'TOTAL':x.category]=x.monthlyLimit);return{transactions:S.tx.map(t=>({id:t.id,timestamp:toLocal(t.timestamp)+':00',amount:t.amount,description:t.description,category:t.category,merchant:t.merchant||''})),budgets:b,today:toLocal(new Date())+':00'}};
let anT=0;function refreshAnalysis(){clearTimeout(anT);if(!S.tx.length){A.data=null;A.sig='';return}anT=setTimeout(async()=>{if(!API.ok)return;const p=analysisPayload(),sig=JSON.stringify([p.transactions,p.budgets,p.today.slice(0,10)]);if(sig===A.sig)return;try{const j=await apiFetch('/api/analyze',p,30000);A.data=j;A.sig=sig;if(['overview','insights','budgets'].includes(S.page))render()}catch(e){if(e.status===401){API.ok=false;API.authFail=true;paintStatus()}}},400)}
async function saveSrv(base,key){base=base.replace(/\/+$/,'');if(base&&!/^https?:\/\//i.test(base))return toast('Server address must start with http:// or https://');API.base=base;API.token=key;await save();A.sig='';await ping();render();refreshAnalysis();toast(API.ok?'Connected to the server':API.authFail?'Server reachable, but the API key was rejected':'Could not reach the server; using offline mode')}
/* analytics: prefer the server's model-based results, fall back to the in-browser rules */
function anomalies(){if(!A.data)return anomaliesLocal();const bc=new Set(A.data.baseline_categories||[]),m=A.data.anomalies.map(a=>{const t=S.tx.find(x=>x.id===a.id);return t&&a.typical?{t,z:a.z,mu:a.typical,md:a.typical,n:a.baseline_n,votes:a.votes,src:'model'}:null}).filter(Boolean);return m.concat(anomaliesLocal().filter(x=>!bc.has(x.t.category))).sort((a,b)=>b.z-a.z)}
function recurring(){if(!A.data)return recurringLocal();return A.data.recurring.map(r=>{const ts=r.ids.map(id=>S.tx.find(x=>x.id===id)).filter(Boolean),l=ts[ts.length-1]||{};return{name:l.merchant||l.description||r.key,amt:r.median_amount,f:r.cadence[0].toUpperCase()+r.cadence.slice(1),last:r.last_date,n:r.occurrences,next:r.next_expected}})}
const capCard=()=>{const c=A.data&&A.data.capacity;if(!c)return'';const overBudget=c.total_budget>0&&c.remaining_budget<=0;const safeSpend=overBudget?'You have already exceeded the budget':fmt(c.safe_daily_spend);const it=(l,v,col)=>`<div style="flex:1 1 150px"><small>${l}</small><br><b style="font-size:${overBudget&&l==='Safe daily spend'?'15px':'20px'};color:${col||'var(--pu)'}">${v}</b></div>`;return `<div class="card"><h2>Spending outlook</h2><div class="fl">${it('Safe daily spend',safeSpend,overBudget?'var(--er)':'')}${it('Committed recurring',fmt(c.committed_recurring))}${it('Available after commitments',fmt(c.available_after_commitments),c.available_after_commitments<0?'var(--er)':'')}${it('Projected month-end',fmt(c.projected_month_end),c.total_budget>0&&c.projected_month_end>c.total_budget?'var(--er)':'')}</div><small>${overBudget?'Your spending has reached or passed your total budget for this month. Review your transactions and budget to plan the rest of the month.':`${c.days_left} day${c.days_left===1?'':'s'} left this month. After upcoming recurring payments, you can spend about ${fmt(c.safe_daily_spend)} a day and stay within your total budget.`} Estimated from your own history.</small></div>`};
const sugCard=()=>{const s=A.data&&A.data.suggested_budgets;if(!s)return'';const rows=Object.entries(s).filter(([k,v])=>v>0&&(k==='TOTAL'||S.cats.includes(k)));if(!rows.length)return'';return `<div class="card"><h2>Suggested starting budgets</h2><small>Median full-month spend in each category plus 10% headroom.</small><div class="list">${rows.map(([k,v])=>{const c=k==='TOTAL'?'Total':k;return `<div class="row"><div class="c-t"><b>${k==='TOTAL'?'Total monthly budget':esc(k)}</b></div><div class="c-a">${fmt(v)}</div><div class="c-x"><button class="btn s sm" data-act="use-sug" data-c="${esc(c)}" data-v="${v}">${budgetOf(c)?'Replace':'Use'}</button></div></div>`}).join('')}</div></div>`};
const txSug={t:0,n:0};
async function suggest(f){const text=f.elements.description.value.trim(),s=$('#sug');if(!s)return;if(text.length<3){s.innerHTML='';f.dataset.sugcat='';return}const n=++txSug.n,p=await smart.predict(text,parseFloat(f.elements.amount.value)||0);if(n!==txSug.n||!document.body.contains(f))return;f.dataset.sugcat=p.matched?p.cat:'';
s.innerHTML=!p.matched?'No suggestion. Pick a category.':p.src==='model'?`Suggested: <b>${esc(p.cat)}</b> (${p.user?'from your earlier correction':'model, '+Math.round(p.conf*100)+'% confident'}${p.review?'; low confidence, please check':''}). Change it below if wrong.`:`Suggested: <b>${esc(p.cat)}</b> (keyword fallback, server offline). Change it below if wrong.`;
if(p.matched&&!f.dataset.touched){const sel=f.elements.category;if(![...sel.options].some(o=>o.value===p.cat))sel.add(new Option(p.cat,p.cat));sel.value=p.cat}}
/* ---------- analytics services ---------- */
const budgetOf=c=>S.budgets.find(b=>b.category===c&&b.month===CM&&b.year===CY);
function anomaliesLocal(){const out=[],g={};S.tx.forEach(t=>(g[t.category]=g[t.category]||[]).push(t));
for(const c in g)g[c].forEach(t=>{const o=g[c].filter(x=>x!==t).map(x=>x.amount);if(o.length<5)return;const mu=o.reduce((a,b)=>a+b,0)/o.length,sd=Math.sqrt(o.reduce((a,b)=>a+(b-mu)**2,0)/o.length),md=median(o),z=sd?(t.amount-mu)/sd:0;if(z>=3&&t.amount>1.5*md)out.push({t,z,mu,md,n:o.length})});
return out.sort((a,b)=>b.z-a.z)}
function outliers(){const hi=anomalies().map(x=>({...x,k:'High'})),lo=[],g={};S.tx.forEach(t=>(g[t.category]=g[t.category]||[]).push(t));
for(const c in g)g[c].forEach(t=>{const o=g[c].filter(x=>x!==t).map(x=>x.amount);if(o.length<5)return;const mu=o.reduce((a,b)=>a+b,0)/o.length,sd=Math.sqrt(o.reduce((a,b)=>a+(b-mu)**2,0)/o.length),md=median(o),z=sd?(t.amount-mu)/sd:0;if(z<=-1&&t.amount<0.35*md)lo.push({t,z,mu,md,n:o.length,k:'Low'})});
return hi.concat(lo).filter(x=>S.rev[x.t.id]!=='dismissed').sort((a,b)=>Math.abs(b.z)-Math.abs(a.z))}
function recurringLocal(){const g={},out=[];S.tx.forEach(t=>{const k=(t.merchant||t.description).toLowerCase().replace(/[^a-z ]/g,'').trim();(g[k]=g[k]||[]).push(t)});
for(const k in g){const a=g[k].sort((x,y)=>x.timestamp.localeCompare(y.timestamp));if(a.length<3)continue;const iv=[];for(let i=1;i<a.length;i++)iv.push((new Date(a[i].timestamp)-new Date(a[i-1].timestamp))/864e5);const md=median(iv),oi=iv.filter(d=>Math.abs(d-md)<=Math.max(3,md*.2)).length/iv.length,am=a.map(t=>t.amount),ma=median(am),oa=am.filter(x=>Math.abs(x-ma)<=ma*.15).length/am.length;
const f=md<=9?'Weekly':md>=25&&md<=35?'Monthly':md>=80&&md<=100?'Quarterly':md>=350&&md<=380?'Yearly':null;
if(f&&oi>=.75&&oa>=.75){const l=a[a.length-1];out.push({name:l.merchant||l.description,amt:ma,f,last:l.timestamp,n:a.length})}}return out}
function insights(){const o=[],m=S.tx.filter(t=>inM(t,CM,CY)),bc=byCat(m);
if(bc.length)o.push(`${bc[0][0]} is your highest-spending category this month (${fmt(bc[0][1])}).`);
S.budgets.filter(b=>b.month===CM&&b.year===CY).forEach(b=>{const s=b.category==='Total'?sum(m):sum(m.filter(t=>t.category===b.category)),p=Math.round(s/b.monthlyLimit*100);if(p>=75)o.push(p>=100?`You have exceeded your ${b.category==='Total'?'monthly':b.category} budget (${p}% used).`:`You have used ${p}% of your ${b.category==='Total'?'monthly':b.category} budget.`)});
const an=anomalies().filter(a=>!S.rev[a.t.id]);if(an.length)o.push(`${an.length} transaction${an.length>1?'s are':' is'} higher than your usual spending in the category. See Insights.`);return o}
/* ---------- UI helpers ---------- */

else if(a==='add-tx')txForm();else if(a==='edit-tx')txForm(t);else if(a==='go-tx'){S.page='transactions';render()}
else if(a==='view-tx')modal(`<h2>${esc(t.description)}</h2><p style="margin:0"><b style="color:var(--pu);font-size:22px">${fmt(t.amount)}</b></p><p style="margin:0">Category: ${esc(t.category)}<br>Merchant: ${esc(t.merchant||'—')}<br>Date: ${new Date(t.timestamp).toLocaleString('en-IN')}<br>Recurring: ${t.isRecurring?'Yes':'No'}<br>Source: ${t.demo?'Synthetic demo record':'Your record'}</p><button class="btn s" data-act="close">Close</button>`)
else if(a==='del-tx')confirmM(`Delete “${esc(t.description)}” (${fmt(t.amount)})?`,()=>{S.tx=S.tx.filter(x=>x.id!==id);commit('Transaction deleted')})
else if(a==='set-budget')budForm();else if(a==='edit-budget')budForm(S.budgets.find(b=>b.id===id))
else if(a==='del-budget')confirmM('Delete this budget?',()=>{S.budgets=S.budgets.filter(b=>b.id!==id);commit('Budget deleted')})
else if(a==='review'){S.rev[id]='reviewed';commit('Marked as reviewed')}else if(a==='dismiss'){S.rev[id]='dismissed';commit('Dismissed')}
else if(a==='export'){if(!S.tx.length)return toast('No transactions to export');const h=['id','timestamp','amount','description','category','merchant','isRecurring'],c=[h.join(',')].concat(S.tx.map(t=>h.map(k=>csvq(t[k])).join(','))).join('\n'),l=document.createElement('a');l.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));l.download='paisawise-transactions.csv';l.click();toast('CSV exported')}
else if(a==='demo'){loadDemo();S.page='overview';commit('Demo data loaded')}
else if(a==='rm-demo'){S.tx=S.tx.filter(x=>!x.demo);S.budgets=S.budgets.filter(x=>!x.demo);commit('Demo data removed')}
else if(a==='clear')confirmM('This permanently deletes all transactions and budgets from this browser. Export a CSV first if you need a copy.',()=>{S.tx=[];S.budgets=[];S.rev={};commit('All transactions and budgets cleared')},'Clear everything')
else if(a==='del-cat')confirmM(`Remove category “${esc(el.dataset.c)}”? Existing transactions keep their label.`,()=>{S.cats=S.cats.filter(c=>c!==el.dataset.c);commit('Category removed')},'Remove')
else if(a==='use-sug'){const c=el.dataset.c,v=+el.dataset.v;let b=budgetOf(c);if(b){b.monthlyLimit=v;delete b.demo}else S.budgets.push({id:uid(),category:c,monthlyLimit:v,month:CM,year:CY});commit('Budget saved')}
else if(a==='confirm'){const f=onConfirm;onConfirm=null;closeM();f&&f()}else if(a==='close')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f){S.f[el.dataset.f]=el.value;$('#txl').innerHTML=listHTML()}
if((el.name==='description'||el.name==='amount')&&el.form&&el.form.dataset.form==='tx'){clearTimeout(txSug.t);const f=el.form;txSug.t=setTimeout(()=>suggest(f),el.name==='description'?250:450)}
if(el.name==='category'&&el.form)el.form.dataset.touched=1});
document.addEventListener('change',async e=>{const el=e.target;if(el.hasAttribute('data-outcat')){S.outCat=el.value;render();return}if(el.dataset.p===undefined&&el.hasAttribute('data-p')){S.period=el.value;render()}
if(el.dataset.f)S.f[el.dataset.f]=el.value;if(el.dataset.f&&el.tagName==='SELECT')$('#txl').innerHTML=listHTML();
if(el.hasAttribute('data-imp')&&el.files[0]){const rows=parseCSV(await el.files[0].text());el.value='';const AL={timestamp:['timestamp','date','datetime','time','txn date','transaction date','value date'],amount:['amount','amount (inr)','amt','debit','withdrawal','txn amount'],description:['description','narration','remarks','particulars','details','reason','note'],category:['category'],merchant:['merchant'],isrecurring:['isrecurring']};
const h=(rows[0]||[]).map(x=>x.trim().toLowerCase()),ix=k=>{for(const n of AL[k]){const i=h.indexOf(n);if(i>=0)return i}return-1};
if(['timestamp','amount','description'].some(k=>ix(k)<0))return toast('Import failed: header must include a date (timestamp), amount and description (narration)');
let bad=0;const parsed=[];rows.slice(1).forEach(r=>{const am=parseFloat(String(r[ix('amount')]||'').replace(/,/g,'')),d=new Date(r[ix('timestamp')]),ds=(r[ix('description')]||'').trim(),c=ix('category')>=0?(r[ix('category')]||'').trim().slice(0,24):'';if(!(am>0)||isNaN(d)||ds.length<2)return bad++;parsed.push({id:uid(),amount:am,description:ds.slice(0,80),category:c,timestamp:d.toISOString(),merchant:ix('merchant')>=0?(r[ix('merchant')]||'').trim().slice(0,40):'',isRecurring:/^(true|1|yes)$/i.test(r[ix('isrecurring')]||''),createdAt:new Date().toISOString()})});
const need=parsed.filter(p=>!p.category);if(need.length){toast(`Categorising ${need.length} row${need.length>1?'s':''}…`);const res=await classifyMany(need);need.forEach((p,i)=>p.category=res[i])}
parsed.forEach(p=>{if(!S.cats.includes(p.category))S.cats.push(p.category);S.tx.push(p)});commit(`Imported ${parsed.length} row${parsed.length===1?'':'s'}${need.length?` (${need.length} categorised by ${API.ok?'the model':'keywords'})`:''}${bad?`, skipped ${bad} invalid`:''}`)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form,v=n=>f.elements[n]?f.elements[n].value.trim():'';f.querySelectorAll('.err').forEach(x=>x.textContent='');const er=(n,m)=>{const s=f.querySelector(`[data-e=${n}]`);s&&(s.textContent=m);return 1};
if(k==='srv')return saveSrv(v('base'),v('key'));if(k==='cat'){const c=v('c');if(S.cats.some(x=>x.toLowerCase()===c.toLowerCase()))return toast('That category already exists');S.cats.push(c);commit('Category added')}
else if(k==='tx'){let bad=0;const am=parseFloat(v('amount')),d=new Date(v('timestamp')),ds=v('description');if(!(am>0&&am<=1e7))bad=er('amount','Enter an amount between ₹0.01 and ₹1,00,00,000');if(ds.length<2)bad=er('description','Enter at least 2 characters');if(isNaN(d)||d>NOW.getTime()+864e5)bad=er('timestamp','Enter a valid date that is not in the future');if(bad)return;
let c=v('newcat')||v('category');if(!S.cats.some(x=>x.toLowerCase()===c.toLowerCase()))S.cats.push(c);const o={amount:Math.round(am*100)/100,description:ds,category:c,timestamp:d.toISOString(),merchant:v('merchant'),isRecurring:f.elements.isRecurring.checked};
const old=f.dataset.id?S.tx.find(t=>t.id===f.dataset.id):null,sug=f.dataset.sugcat||'';if(API.ok&&(old?old.category!==c:sug!==c))teach(ds,o.amount,c);if(f.dataset.id)Object.assign(old,o);else S.tx.push({id:uid(),createdAt:new Date().toISOString(),...o});closeM();commit(f.dataset.id?'Transaction updated':'Transaction saved')}
else if(k==='bud'){const l=parseFloat(v('limit'));if(!(l>0))return er('limit','Enter a limit above ₹0');const cat=f.dataset.id?S.budgets.find(b=>b.id===f.dataset.id).category:v('category');let b=budgetOf(cat);if(b){b.monthlyLimit=l;delete b.demo}else S.budgets.push({id:uid(),category:cat,monthlyLimit:l,month:CM,year:CY});closeM();commit('Budget saved')}});
(async()=>{db=await open();if(!db)mode='Memory only (browser blocked IndexedDB; data is lost on refresh)';else{for(const k of['tx','budgets','cats','rev']){const v=await kvGet(k);if(v)S[k]=v}const cfg=await kvGet('cfg');if(cfg){API.base=cfg.base||'';API.token=cfg.token||''}}render();await ping();render();refreshAnalysis();setInterval(ping,30000)})();
</script></body></html>
